# cyberdeck tmux theme — installed to ~/.tmux.conf by setup.sh (only if absent).
# Green-on-black status bar matching the deck prompt/banner.

set -g status-style "bg=black,fg=green"
set -g status-left "#[fg=cyan,bold] DECK #[fg=green]│ "
set -g status-left-length 12
set -g status-right "#[fg=green]│ #[fg=cyan]#H #[fg=green]│ #[fg=cyan]%H:%M "
set -g window-status-current-style "fg=cyan,bold"
set -g pane-active-border-style "fg=green"
set -g pane-border-style "fg=colour22"

set -g history-limit 10000
set -g mouse on
set -g default-terminal "tmux-256color"

# ── development keybindings ──────────────────────────────────────────────────
# Alt-C: split right, open Claude Code in the new pane
bind-key -n M-c split-window -h -c "#{pane_current_path}" \; \
    send-keys 'claude' Enter
# Alt-M: split down, open htop for hardware monitoring
bind-key -n M-m split-window -v -c "#{pane_current_path}" \; \
    send-keys 'htop' Enter
# Alt-N: split right, open Neovim
bind-key -n M-n split-window -h -c "#{pane_current_path}" \; \
    send-keys 'nvim' Enter
# Alt-Q: kill current pane
bind-key -n M-q kill-pane

# ── development layouts (prefix + key) ───────────────────────────────────────
# prefix + C-d: dev layout — code (left 60%) + logs/claude (right 40%)
bind-key C-d select-layout "b5e9,240x60,0,0{158x60,0,0,0,81x60,159,0,1}"
# prefix + C-t: terminal layout — three vertical panes
bind-key C-t select-layout "3b59,240x60,0,0{119x60,0,0,0,59x60,120,0,2,59x60,180,0,3}"
# prefix + C-f: full-screen for current pane (zoom)
bind-key C-f resize-pane -Z
