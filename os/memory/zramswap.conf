# zram swap configuration (Debian zram-tools) — installed to /etc/default/zramswap.
#
# zram creates a compressed swap device in RAM. With zstd (~3:1 ratio), giving
# 50% of RAM to zram effectively adds ~RAM/3 of extra usable memory at near-RAM
# speed, with zero SD-card wear. Works on any Pi 4B variant (1–8 GB) and Pi 5.

# zstd: best compression ratio; well-supported by the Raspberry Pi OS kernel (6.x).
ALGO=zstd

# Size of the zram device as a percent of total RAM. 50% is the sweet spot:
# Pi 4 4GB -> 2 GB zram (~6 GB effective), Pi 5 8GB -> 4 GB zram.
PERCENT=50

# Higher priority than any disk swap, so zram is always used first.
PRIORITY=100

# Number of zram devices. On multi-core Pi 4/5, multiple devices = parallel
# compression streams (one per CPU). The zram-tools package names them
# /dev/zram0..N. Set to 0 to use a single device (default).
# Pi 5 (4 cores): use 4 for best throughput under memory pressure.
# Pi 4 (4 cores): use 2 on 1-2 GB boards, 4 on 4-8 GB boards.
#NZM_NUM_DEVICES=4
