# Kernel VM tuning for zram swap — installed to /etc/sysctl.d/90-cyberdeck-vm.conf.
# These are the kernel-docs-recommended settings for RAM-backed swap
# (Documentation/admin-guide/blockdev/zram.rst). Apply live: sudo sysctl --system

# Swap early and often: moving an idle page into compressed RAM is far cheaper
# than evicting file cache. Range 0-200; >100 only makes sense for zram.
vm.swappiness = 180

# zram has no seek penalty — read swapped pages back one at a time (2^0),
# instead of the disk-oriented default of 8 at a time (2^3).
vm.page-cluster = 0

# Don't inflate watermarks after fragmentation events; keeps more RAM usable
# instead of held in reserve.
vm.watermark_boost_factor = 0

# Wake background reclaim (kswapd) slightly earlier so memory pressure is
# handled gradually instead of in a UI-freezing burst when FreeCAD spikes.
vm.watermark_scale_factor = 125
