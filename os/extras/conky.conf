-- cyberdeck always-on status overlay (top-right corner, click-through).
-- Installed to /opt/cyberdeck/conky.conf, autostarted at desktop login.
conky.config = {
    alignment = 'top_right',
    gap_x = 16, gap_y = 16,
    minimum_width = 230,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 140,
    own_window_colour = '070B08',
    double_buffer = true,
    use_xft = true,
    font = 'DejaVu Sans Mono:size=10',
    default_color = '39FF14',
    color1 = '00E5E5',
    color2 = '1C5A28',
    update_interval = 2,
    draw_shades = false,
}

conky.text = [[
${color1}DFCD${color2} ──────────────────${color}
${color1}time${color}  ${time %H:%M:%S}  ${time %d %b}
${color1}ip${color}    ${if_existing /sys/class/net/wlan0}${addr wlan0}${else}${if_existing /sys/class/net/eth0}${addr eth0}${else}offline${endif}${endif}
${color1}temp${color}  ${acpitemp}°C ${hwmon 0 temp 1}°C ${execi 30 bash -c 't=$(vcgencmd get_throttled 2>/dev/null); [[ $t =~ 0x0$|^$ ]] || echo ⚠'}
${color1}cpu${color}   ${cpu}%  ${freq_g} GHz
${color1}mem${color}   ${mem} / ${memmax}
${color1}swap${color}  ${swap} / ${swapmax} (zram)
${color1}disk${color}  ${fs_used /} / ${fs_size /}
${color1}up${color}    ${uptime_short}
${color2}──────────────────────${color}
]]
